name: Audit issue 3 scientific gate

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Evaluate committed completion matrix
        run: |
          python3 scripts/summarize_issue3_completion.py \
            benchmarks/results/2026-09-04 \
            /tmp/ISSUE3_AUDIT.md
      - name: Print generated audit
        if: always()
        run: cat /tmp/ISSUE3_AUDIT.md || true
