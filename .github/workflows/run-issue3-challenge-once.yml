name: Record issue 3 sparse voltage challenges

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format, lint, and run challenge twice
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          mkdir -p challenge-a challenge-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_bootstrap_challenge --all-features \
            | tee challenge-a/issue3-bootstrap-challenge.tsv
          cargo run --locked --release -p multiway-mg \
            --example issue3_bootstrap_challenge --all-features \
            | tee challenge-b/issue3-bootstrap-challenge.tsv
          cmp challenge-a/issue3-bootstrap-challenge.tsv \
              challenge-b/issue3-bootstrap-challenge.tsv
      - name: Commit formatter output and evidence
        run: |
          mkdir -p benchmarks/results/2026-09-04
          cp challenge-a/issue3-bootstrap-challenge.tsv \
             benchmarks/results/2026-09-04/issue3-bootstrap-challenge.tsv
          rm .github/workflows/run-issue3-challenge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record sparse voltage-lift bootstrap challenges"
          git push origin HEAD:codex/issue-3-repair-bootstrap
