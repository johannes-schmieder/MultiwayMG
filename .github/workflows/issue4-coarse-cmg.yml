# One-time calibration workflow; remove before merge.
# Temporary write permission is only to commit pinned rustfmt output on this branch.
name: Issue 4 coarse-CMG calibration

on:
  push:
    branches: [codex/issue-4-coarse-cmg]
    paths: [.github/workflows/issue4-coarse-cmg.yml]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  coarse-cmg:
    name: Frozen coarse-CMG comparison
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-4-coarse-cmg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply and commit pinned rustfmt
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/multiway-mg/examples/issue4_coarse_cmg.rs
            git commit -m "Apply pinned rustfmt to coarse-CMG harness"
            git push origin HEAD:codex/issue-4-coarse-cmg
          fi
      - name: Record reproducibility metadata
        run: |
          mkdir -p issue4-coarse-cmg-output
          {
            git rev-parse HEAD
            echo "event=$GITHUB_EVENT_NAME sha=$(git rev-parse HEAD) run=$GITHUB_RUN_ID"
            rustc --version --verbose
            uname -a
            lscpu
            echo "RAYON_NUM_THREADS=$RAYON_NUM_THREADS"
            echo "OMP_NUM_THREADS=$OMP_NUM_THREADS OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS"
            grep -E '^(cmg|schwarz-precond|within) =' Cargo.toml
          } > issue4-coarse-cmg-output/metadata.txt
      - name: Check harness
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p multiway-mg --all-features --example issue4_coarse_cmg -- -D warnings
          cargo test --locked -p multiway-mg --all-features --example issue4_coarse_cmg
      - name: Build release benchmark
        run: cargo build --locked --release -p multiway-mg --all-features --example issue4_coarse_cmg
      - name: Run frozen calibration
        run: |
          /usr/bin/time -v -o issue4-coarse-cmg-output/process-resources.txt \
            target/release/examples/issue4_coarse_cmg issue4-coarse-cmg-output \
            2> issue4-coarse-cmg-output/warnings.txt
      - name: Validate and summarize
        run: |
          python3 scripts/summarize_issue4_coarse_cmg.py \
            issue4-coarse-cmg-output/coarse-cmg.tsv \
            issue4-coarse-cmg-output/SUMMARY.md
          (cd issue4-coarse-cmg-output && sha256sum coarse-cmg.tsv metadata.txt > checksums.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-4-coarse-cmg-output
          path: issue4-coarse-cmg-output/
          if-no-files-found: error
