# One-time calibration workflow; remove before merge.
name: Issue 4 coarse-CMG calibration

on:
  push:
    branches: [codex/issue-4-coarse-cmg]
    paths: [.github/workflows/issue4-coarse-cmg.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  coarse-cmg:
    name: Automatic and oracle-map coarse-CMG comparison
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Record reproducibility metadata
        run: |
          for mode in automatic oracle; do
            mkdir -p "issue4-coarse-cmg-$mode"
            {
              git rev-parse HEAD
              echo "mode=$mode event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
              rustc --version --verbose
              uname -a
              lscpu
              echo "RAYON_NUM_THREADS=$RAYON_NUM_THREADS"
              echo "OMP_NUM_THREADS=$OMP_NUM_THREADS OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS"
              grep -E '^(cmg|schwarz-precond|within) =' Cargo.toml
            } > "issue4-coarse-cmg-$mode/metadata.txt"
          done
      - name: Check harness and validator
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p multiway-mg --all-features --example issue4_coarse_cmg -- -D warnings
          cargo test --locked -p multiway-mg --all-features --example issue4_coarse_cmg
          python3 -m unittest discover -s scripts -p test_issue4_coarse_cmg_summary.py
      - name: Build release benchmark
        run: cargo build --locked --release -p multiway-mg --all-features --example issue4_coarse_cmg
      - name: Run automatic calibration
        run: |
          /usr/bin/time -v -o issue4-coarse-cmg-automatic/process-resources.txt \
            target/release/examples/issue4_coarse_cmg issue4-coarse-cmg-automatic automatic \
            2> issue4-coarse-cmg-automatic/warnings.txt
      - name: Run oracle-map calibration
        run: |
          /usr/bin/time -v -o issue4-coarse-cmg-oracle/process-resources.txt \
            target/release/examples/issue4_coarse_cmg issue4-coarse-cmg-oracle oracle \
            2> issue4-coarse-cmg-oracle/warnings.txt
      - name: Validate and summarize
        run: |
          python3 scripts/summarize_issue4_coarse_cmg.py \
            issue4-coarse-cmg-automatic/coarse-cmg.tsv \
            issue4-coarse-cmg-automatic/SUMMARY.md automatic
          python3 scripts/summarize_issue4_coarse_cmg.py \
            issue4-coarse-cmg-oracle/coarse-cmg.tsv \
            issue4-coarse-cmg-oracle/SUMMARY.md oracle
          for mode in automatic oracle; do
            (cd "issue4-coarse-cmg-$mode" && sha256sum coarse-cmg.tsv metadata.txt > checksums.sha256)
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-4-coarse-cmg-output
          path: |
            issue4-coarse-cmg-automatic/
            issue4-coarse-cmg-oracle/
          if-no-files-found: error
