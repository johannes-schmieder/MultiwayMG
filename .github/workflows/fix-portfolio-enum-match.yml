name: Fix issue 3 portfolio enum match

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Add the required wildcard arm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/multiway-mg/examples/issue3_portfolio_holdout.rs')
          text = path.read_text()
          old = '''        BootstrapAcceptanceScreen::Rejected => "rejected-primary-final",
    }
}
'''
          new = '''        BootstrapAcceptanceScreen::Rejected => "rejected-primary-final",
        _ => "rejected-unknown-screen",
    }
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one enum match tail, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo check --locked -p multiway-mg --example issue3_portfolio_holdout --all-features
      - name: Remove diagnostics and one-time workflow, then commit
        run: |
          rm -rf diagnostics
          rm .github/workflows/fix-portfolio-enum-match.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix portfolio holdout non-exhaustive enum handling"
          git push origin HEAD:codex/issue-3-repair-bootstrap
