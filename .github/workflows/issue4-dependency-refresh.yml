name: Issue 4 dependency refresh

on:
  push:
    branches:
      - codex/issue-4-pair-solver-economics
    paths:
      - .issue4/refresh-dependencies
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh lockfile and export complete vendor tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Generate exact lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Lock frozen within comparator dependencies"
            git push
          fi
      - name: Export complete locked vendor tree
        shell: bash
        run: |
          set -euo pipefail
          cargo vendor --locked issue4-vendor > issue4-vendor-config.toml
          tar -czf issue4-vendor.tar.gz issue4-vendor
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-complete-vendor
          path: |
            issue4-vendor.tar.gz
            issue4-vendor-config.toml
          if-no-files-found: error
          retention-days: 3
