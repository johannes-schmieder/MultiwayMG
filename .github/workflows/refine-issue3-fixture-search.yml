name: Refine issue 3 sparse fixture search

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lower the materiality threshold and rerun
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/multiway-mg/examples/issue3_fixture_search.rs')
          text = path.read_text()
          text = text.replace('if oracle_condition > 2.5 {', 'if oracle_condition > 5.0 {')
          text = text.replace(
              'if one_shot_condition < 1.35 * oracle_condition {',
              'if one_shot_condition < 1.10 * oracle_condition {',
          )
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo run --locked --release -p multiway-mg \
            --example issue3_fixture_search --all-features \
            | tee issue3-fixture-search.tsv
      - name: Commit refined search and evidence
        run: |
          cp issue3-fixture-search.tsv \
             benchmarks/results/2026-09-04/issue3-fixture-search.tsv
          rm .github/workflows/refine-issue3-fixture-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine sparse issue 3 fixture search"
          git push origin HEAD:codex/issue-3-repair-bootstrap
