name: Run frozen issue 3 portfolio holdout

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify frozen policy and format
        run: |
          test -f benchmarks/policies/issue3-portfolio-holdout.tsv
          grep -q $'fixture\tdominant-pair-weak-third-a\t600' \
            benchmarks/policies/issue3-portfolio-holdout.tsv
          grep -q $'fixture\ttensor-grid\t609' \
            benchmarks/policies/issue3-portfolio-holdout.tsv
          cargo fmt --all
      - name: Strict lint and focused tests
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p multiway-mg --all-features --test bootstrap_portfolio
          cargo test --locked -p multiway-mg --all-features --test bootstrap
          cargo test --locked -p multiway-mg --all-features --test repair
      - name: Run the new holdout twice and compare bytes
        run: |
          rm -rf portfolio-a portfolio-b
          mkdir portfolio-a portfolio-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_portfolio_holdout --all-features -- portfolio-a
          cargo run --locked --release -p multiway-mg \
            --example issue3_portfolio_holdout --all-features -- portfolio-b
          cmp portfolio-a/issue3-portfolio-holdout.tsv \
              portfolio-b/issue3-portfolio-holdout.tsv
          cmp portfolio-a/issue3-portfolio-traces.tsv \
              portfolio-b/issue3-portfolio-traces.tsv
      - name: Commit formatted source and frozen evidence
        run: |
          mkdir -p benchmarks/results/2026-09-04
          cp portfolio-a/issue3-portfolio-holdout.tsv \
             benchmarks/results/2026-09-04/issue3-portfolio-holdout.tsv
          cp portfolio-a/issue3-portfolio-traces.tsv \
             benchmarks/results/2026-09-04/issue3-portfolio-traces.tsv
          rm .github/workflows/run-portfolio-holdout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record frozen issue 3 portfolio holdout"
          git push origin HEAD:codex/issue-3-repair-bootstrap
