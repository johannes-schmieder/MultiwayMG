name: Repair and diagnose complete-cycle quality probe

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: full

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply mechanical formatting and Clippy fixes
        run: |
          cargo fmt --all
          cargo clippy --fix --allow-dirty --allow-staged \
            --locked --workspace --all-targets --all-features
          cargo fmt --all
      - name: Run strict lint and capture focused numerical tests
        shell: bash
        run: |
          rm -rf diagnostics/cycle-probe
          mkdir -p diagnostics/cycle-probe
          set +e
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings \
            > diagnostics/cycle-probe/clippy.log 2>&1
          clippy_status=$?
          cargo test --locked -p multiway-mg --all-features --test cycle_probe -- --nocapture \
            > diagnostics/cycle-probe/test.log 2>&1
          test_status=$?
          printf 'clippy_status=%s\ntest_status=%s\n' \
            "$clippy_status" "$test_status" \
            > diagnostics/cycle-probe/status.txt
          cat diagnostics/cycle-probe/status.txt
          tail -n 200 diagnostics/cycle-probe/clippy.log || true
          tail -n 300 diagnostics/cycle-probe/test.log || true
          if [ "$clippy_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            printf 'passed\n' > diagnostics/cycle-probe/verdict.txt
          else
            printf 'failed\n' > diagnostics/cycle-probe/verdict.txt
          fi
          exit 0
      - name: Commit exact result and remove one-time workflows
        run: |
          rm -f .github/workflows/repair-cycle-probe.yml
          rm -f .github/workflows/format-test-cycle-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and diagnose complete-cycle quality probe"
          git push origin HEAD:codex/issue-3-repair-bootstrap
