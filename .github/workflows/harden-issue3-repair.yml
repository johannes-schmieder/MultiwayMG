name: One-time issue 3 repair hardening

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Apply patch, format, and validate repair tests
        run: |
          python3 scripts/harden_issue3_repair.py
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p multiway-mg --all-features --test repair
      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Make repair structural budgets authoritative"
          git push origin HEAD:codex/issue-3-repair-bootstrap
