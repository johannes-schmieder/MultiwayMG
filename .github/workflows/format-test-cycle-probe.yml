name: Format and validate complete-cycle quality probe

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact Rust formatting
        run: cargo fmt --all
      - name: Strict lint and focused tests
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p multiway-mg --all-features --test cycle_probe
          cargo test --locked -p multiway-mg --all-features --test bootstrap_portfolio
          cargo test --locked -p multiway-mg --all-features --test bootstrap
          cargo test --locked -p multiway-mg --all-features --test repair
      - name: Commit formatter output and remove this workflow
        run: |
          rm .github/workflows/format-test-cycle-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add matrix-free complete-cycle quality probe"
          git push origin HEAD:codex/issue-3-repair-bootstrap
