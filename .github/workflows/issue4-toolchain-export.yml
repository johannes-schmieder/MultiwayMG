name: Issue 4 Rust toolchain export

on:
  push:
    branches:
      - codex/issue-4-pair-solver-economics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export exact Rust 1.85 toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Archive installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustc +1.85.0 --print sysroot)"
          tar -C "$(dirname "$toolchain")" -czf rust-1.85.0-x86_64-unknown-linux-gnu.tar.gz "$(basename "$toolchain")"
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-rust-1.85-toolchain
          path: rust-1.85.0-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 3
