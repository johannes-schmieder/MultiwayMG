name: Assemble complete MAP cycle allocation source
on:
  push:
    branches: [implementation/issue-5-cycle-assembly]
    paths: [.github/workflows/issue5-cycle-assembly.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Add only the isolated test dependency and bounded documentation updates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('crates/multiway-mg/Cargo.toml')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='61b17f5f8f21e7c083b907363f465095c23b1458'
          p.write_text(p.read_text()+'\n\n[dev-dependencies]\nstats_alloc = "=0.1.10"\n\n[[test]]\nname = "workspace_allocations"\npath = "tests/workspace_allocations.rs"\nharness = false\n')
          p=Path('docs/ISSUE5_PCG_WORKSPACE.md')
          text=p.read_text()
          text=text.replace('The existing MAP and structural projection internals also still\nallocate.', 'The complete prepared MAP hierarchy now retains its nested operator scratch;\nsee `ISSUE5_WORKSPACES.md` for the allocation gate. Outer PCG vectors,\nprojection calls and trace storage still allocate.')
          p.write_text(text)
          p=Path('docs/ISSUE5_OPERATOR_WORKSPACES.md')
          text=p.read_text().replace('Hierarchy integration and measured\nwhole-cycle allocation qualification are separate work.', 'Hierarchy integration and the measured complete-cycle allocation contract are\nnow documented in `ISSUE5_WORKSPACES.md`.')
          p.write_text(text)
          p=Path('CHANGELOG.md')
          text=p.read_text(); marker='### Added\n\n'; assert text.count(marker)==1
          text=text.replace(marker,marker+'- Complete prepared recursive MAP-cycle scratch, including nested projection,\n  MAP and dense-terminal modal storage; explicit reprepare and checked memory\n  boundaries with isolated allocator regression gates on three platforms.\n',1)
          p.write_text(text)
          PY
          cp Cargo.lock /tmp/old-cycle-Cargo.lock
          cargo metadata --format-version 1 > /tmp/cycle-metadata.json
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          def packages(path):
              return {(p['name'],p['version'],p.get('source','')):p for p in tomllib.loads(Path(path).read_text())['package']}
          old=packages('/tmp/old-cycle-Cargo.lock'); new=packages('Cargo.lock')
          added=set(new)-set(old)
          assert len(added)==1 and next(iter(added))[:2]==('stats_alloc','0.1.10'),added
          assert not set(old)-set(new)
          for key,p in old.items():
              if key[0]=='multiway-mg':
                  expected=dict(p); expected['dependencies']=sorted(p['dependencies']+['stats_alloc']); assert new[key]==expected
              else: assert new[key]==p,key
          PY
          cargo fmt --all
          git diff --check
      - name: Publish permanent tree without source-edit machinery
        run: |
          set -euo pipefail
          git rm .github/workflows/issue5-cycle-assembly.yml
          git add crates docs CHANGELOG.md Cargo.lock .github/workflows/issue5-workspace-allocations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format complete MAP cycle source and lock dev-only allocator instrument'
          git push origin HEAD:implementation/issue-5-cycle-assembly
          git log -1 --format='source_commit=%H%nsource_tree=%T'
