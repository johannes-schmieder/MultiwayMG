# One-time indentation-independent rescue/finalizer for PR #21.
name: Issue 5 hierarchy workspace v9

on:
  push:
    branches: [codex/issue-5-hierarchy-workspace]
    paths: [.github/workflows/issue5-hierarchy-workspace-v9.yml]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GH_TOKEN: ${{ github.token }}

jobs:
  implement-test-clean-merge:
    name: Complete exact reusable hierarchy workspace slice
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-5-hierarchy-workspace
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Complete compiler-guided source refactor when absent
        run: |
          if ! grep -q 'pub fn application_workspace(&self)' crates/multiway-mg/src/hierarchy.rs; then
            test -f scripts/issue5_hierarchy_workspace_refactor_v8.py
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/issue5_hierarchy_workspace_refactor_v8.py")
          text = path.read_text()
          pattern = re.compile(
              r'^        header = source\[block\.start : block\.opening\]\n'
              r'        if required in " "\.join\(header\.split\(\)\):\n'
              r'            return block$',
              re.MULTILINE,
          )
          replacement = '''        header = " ".join(source[block.start : block.opening].split())
                  if required == "CycleScreenedMapHierarchy":
                      if header == "impl CycleScreenedMapHierarchy":
                          return block
                  elif required in header:
                      return block'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"exact impl matcher replacement count={count}")
          path.write_text(text)
          PY
            python3 scripts/issue5_hierarchy_workspace_refactor_v8.py
          fi
      - name: Audit implementation contracts before validation
        run: |
          grep -q 'pub struct CycleScreenedMapHierarchyWorkspace' crates/multiway-mg/src/hierarchy.rs
          grep -q 'pub fn application_workspace(&self)' crates/multiway-mg/src/hierarchy.rs
          grep -q 'pub fn apply_with_workspace(' crates/multiway-mg/src/hierarchy.rs
          grep -q 'with_hierarchy_scratch(&mut workspace.buffers' crates/multiway-mg/src/hierarchy.rs
          test "$(grep -c 'hierarchy_scratch_zeroed' crates/multiway-mg/src/hierarchy.rs)" -ge 2
          ! grep -q 'workspace_binding' crates/multiway-mg/src/hierarchy.rs
          ! grep -q 'Mutex<' crates/multiway-mg/src/hierarchy.rs
          ! grep -q 'RwLock<' crates/multiway-mg/src/hierarchy.rs
          ! grep -q 'unsafe {' crates/multiway-mg/src/hierarchy.rs
          grep -q 'hierarchy_workspace_is_exact_reusable_and_cross_instance_safe' \
            crates/multiway-mg/tests/hierarchy_workspace.rs
          grep -q 'CycleScreenedMapHierarchyWorkspace' crates/multiway-mg/src/lib.rs
      - name: Validate targeted and complete repository matrices
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p multiway-mg --all-features --test hierarchy_workspace
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features
          cargo doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit clean permanent head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md crates/multiway-mg/src/hierarchy.rs \
            crates/multiway-mg/src/lib.rs crates/multiway-mg/tests/hierarchy_workspace.rs
          git rm -f --ignore-unmatch scripts/issue5_hierarchy_workspace_refactor*.py
          git rm -f --ignore-unmatch .github/workflows/issue5-hierarchy*.yml
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Add reusable hierarchy application workspace"
            git push origin HEAD:codex/issue-5-hierarchy-workspace
          fi
          git fetch origin main
          python3 - <<'PY'
          import subprocess

          expected = {
              "CHANGELOG.md",
              "crates/multiway-mg/src/hierarchy.rs",
              "crates/multiway-mg/src/lib.rs",
              "crates/multiway-mg/tests/hierarchy_workspace.rs",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"clean-head scope mismatch: got={sorted(changed)} expected={sorted(expected)}"
              )
          PY
      - name: Mark ready and attempt exact-clean-head squash merge
        run: |
          head_sha=$(git rev-parse HEAD)
          if [ "$(gh pr view 21 --repo johannes-schmieder/MultiwayMG --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready 21 --repo johannes-schmieder/MultiwayMG
          fi
          gh api \
            --method PUT \
            repos/johannes-schmieder/MultiwayMG/pulls/21/merge \
            -f merge_method=squash \
            -f sha="$head_sha" \
            -f commit_title='Add reusable hierarchy application workspace (#21)' \
            -f commit_message='Continue issue #5 with caller-owned recursive hierarchy scratch, retained-memory diagnostics, cross-instance reuse, and exact numerical-equivalence tests.'
