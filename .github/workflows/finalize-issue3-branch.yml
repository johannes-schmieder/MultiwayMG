name: Finalize issue 3 branch

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Promote final project documents
        run: |
          mv README.issue3-final.md README.md
          mv docs/ROADMAP.issue3-final.md docs/ROADMAP.md
          mv CHANGELOG.issue3-final.md CHANGELOG.md
      - name: Remove obsolete one-time orchestration and patch helpers
        run: |
          rm -f \
            .github/workflows/advance-issue3-after-recursive-validation.yml \
            .github/workflows/dispatch-issue3-v2-result.yml \
            .github/workflows/finish-issue3.yml \
            .github/workflows/issue3-authoritative-finalizer.yml \
            .github/workflows/run-issue3-cycle-v2.yml \
            .github/workflows/run-portfolio-holdout.yml \
            .github/workflows/validate-issue3-cycle-hierarchy.yml \
            scripts/add_bootstrap_timing.py \
            scripts/finalize_issue3_docs.py
      - name: Validate final issue 3 tree
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
          python3 scripts/run_issue3_completion_gate.py
      - name: Remove this workflow and commit final branch
        run: |
          rm .github/workflows/finalize-issue3-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize issue 3 automatic-coarsening result"
          git push origin HEAD:codex/issue-3-completion-clean
