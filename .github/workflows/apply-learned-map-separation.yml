name: Apply learned-map separation

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply source patch and validate targeted paths
        run: |
          python3 scripts/separate_learned_and_baseline_maps.py
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p multiway-mg --test bootstrap --all-features
          cargo test --locked -p multiway-mg --test cycle_smoother_portfolio --all-features
          cargo test --locked --workspace --no-default-features
      - name: Remove one-time files and commit
        run: |
          rm .github/workflows/apply-learned-map-separation.yml
          rm scripts/separate_learned_and_baseline_maps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate witness-learned and protected structural maps"
          git push origin HEAD:codex/issue-3-completion-clean
