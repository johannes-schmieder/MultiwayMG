name: Authoritative issue 3 completion gate

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap
  workflow_dispatch:

concurrency:
  group: multiwaymg-issue3-authoritative-finalization
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GH_TOKEN: ${{ github.token }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0

      - name: Stop cleanly if issue 3 is already merged
        id: preflight
        shell: bash
        run: |
          state="$(gh issue view 3 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$state" = "CLOSED" ]; then
            echo 'already_complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_complete=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.preflight.outputs.already_complete != 'true'
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.preflight.outputs.already_complete != 'true'

      - name: Rebase onto current main
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi

      - name: Verify frozen research policies
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          test -f benchmarks/policies/issue3-cycle-portfolio-v2.tsv
          test -f benchmarks/policies/issue3-recursive-cycle-v1.tsv
          grep -q $'fixture\tcover-latin-a\t700' benchmarks/policies/issue3-cycle-portfolio-v2.tsv
          grep -q $'fixture\tcover-communities-b\t709' benchmarks/policies/issue3-cycle-portfolio-v2.tsv
          grep -q $'fixture\trecursive-latin-depth-2\t800' benchmarks/policies/issue3-recursive-cycle-v1.tsv
          grep -q $'fixture\trecursive-communities-depth-3\t807' benchmarks/policies/issue3-recursive-cycle-v1.tsv
          test -f docs/ISSUE3_PORTFOLIO_V1_NEGATIVE.md

      - name: Full Rust validation
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps

      - name: Run one-level frozen holdout twice
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          rm -rf /tmp/issue3-cycle-a /tmp/issue3-cycle-b
          mkdir -p /tmp/issue3-cycle-a /tmp/issue3-cycle-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_cycle_holdout --all-features -- /tmp/issue3-cycle-a
          cargo run --locked --release -p multiway-mg \
            --example issue3_cycle_holdout --all-features -- /tmp/issue3-cycle-b
          cmp /tmp/issue3-cycle-a/issue3-cycle-holdout.tsv \
              /tmp/issue3-cycle-b/issue3-cycle-holdout.tsv
          cmp /tmp/issue3-cycle-a/issue3-cycle-traces.tsv \
              /tmp/issue3-cycle-b/issue3-cycle-traces.tsv
          python3 scripts/summarize_issue3_cycle_holdout.py \
            /tmp/issue3-cycle-a /tmp/issue3-cycle-a/ISSUE3_CYCLE_HOLDOUT_RESULTS.md

      - name: Run recursive frozen holdout twice
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          rm -rf /tmp/issue3-recursive-a /tmp/issue3-recursive-b
          mkdir -p /tmp/issue3-recursive-a /tmp/issue3-recursive-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_recursive_holdout --all-features -- /tmp/issue3-recursive-a
          cargo run --locked --release -p multiway-mg \
            --example issue3_recursive_holdout --all-features -- /tmp/issue3-recursive-b
          cmp /tmp/issue3-recursive-a/issue3-recursive-holdout.tsv \
              /tmp/issue3-recursive-b/issue3-recursive-holdout.tsv
          cmp /tmp/issue3-recursive-a/issue3-recursive-traces.tsv \
              /tmp/issue3-recursive-b/issue3-recursive-traces.tsv
          python3 scripts/summarize_issue3_recursive_holdout.py \
            /tmp/issue3-recursive-a \
            /tmp/issue3-recursive-a/ISSUE3_RECURSIVE_HOLDOUT_RESULTS.md

      - name: Preserve authoritative evidence and finalize documentation
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          mkdir -p benchmarks/results/2026-09-04
          cp /tmp/issue3-cycle-a/issue3-cycle-holdout.tsv \
            benchmarks/results/2026-09-04/issue3-cycle-holdout.tsv
          cp /tmp/issue3-cycle-a/issue3-cycle-traces.tsv \
            benchmarks/results/2026-09-04/issue3-cycle-traces.tsv
          cp /tmp/issue3-cycle-a/ISSUE3_CYCLE_HOLDOUT_RESULTS.md \
            docs/ISSUE3_CYCLE_HOLDOUT_RESULTS.md
          printf '0\n' > benchmarks/results/2026-09-04/issue3-cycle-gate-status.txt
          cp /tmp/issue3-recursive-a/issue3-recursive-holdout.tsv \
            benchmarks/results/2026-09-04/issue3-recursive-holdout.tsv
          cp /tmp/issue3-recursive-a/issue3-recursive-traces.tsv \
            benchmarks/results/2026-09-04/issue3-recursive-traces.tsv
          cp /tmp/issue3-recursive-a/ISSUE3_RECURSIVE_HOLDOUT_RESULTS.md \
            docs/ISSUE3_RECURSIVE_HOLDOUT_RESULTS.md
          printf '0\n' > benchmarks/results/2026-09-04/issue3-recursive-gate-status.txt
          (
            cd benchmarks/results/2026-09-04
            sha256sum \
              issue3-cycle-holdout.tsv \
              issue3-cycle-traces.tsv \
              issue3-recursive-holdout.tsv \
              issue3-recursive-traces.tsv \
              > issue3-final-holdouts.sha256
          )
          python3 scripts/finalize_issue3_docs.py

      - name: Install permanent issue 3 CI gate
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          if 'issue-3-automatic-coarsening:' not in text:
              text += '''

  issue-3-automatic-coarsening:
    name: Issue 3 automatic-coarsening gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic one-level gate twice
        run: |
          mkdir -p cycle-a cycle-b
          for output in cycle-a cycle-b; do
            cargo run --locked --release -p multiway-mg \\
              --example issue3_cycle_holdout --all-features -- "$output"
          done
          cmp cycle-a/issue3-cycle-holdout.tsv cycle-b/issue3-cycle-holdout.tsv
          cmp cycle-a/issue3-cycle-traces.tsv cycle-b/issue3-cycle-traces.tsv
          python3 scripts/summarize_issue3_cycle_holdout.py \\
            cycle-a cycle-a/ISSUE3_CYCLE_HOLDOUT_RESULTS.md
      - name: Run deterministic recursive gate twice
        run: |
          mkdir -p recursive-a recursive-b
          for output in recursive-a recursive-b; do
            cargo run --locked --release -p multiway-mg \\
              --example issue3_recursive_holdout --all-features -- "$output"
          done
          cmp recursive-a/issue3-recursive-holdout.tsv \\
              recursive-b/issue3-recursive-holdout.tsv
          cmp recursive-a/issue3-recursive-traces.tsv \\
              recursive-b/issue3-recursive-traces.tsv
          python3 scripts/summarize_issue3_recursive_holdout.py \\
            recursive-a recursive-a/ISSUE3_RECURSIVE_HOLDOUT_RESULTS.md
'''
          path.write_text(text)
          PY

      - name: Revalidate finalized tree
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps

      - name: Commit final issue 3 tree
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          rm .github/workflows/issue3-authoritative-finalizer.yml
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -delete
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete deterministic automatic three-way coarsening'
            git pull --rebase origin codex/issue-3-repair-bootstrap
            git push origin HEAD:codex/issue-3-repair-bootstrap
          fi

      - name: Open or update completion PR
        if: steps.preflight.outputs.already_complete != 'true'
        id: pr
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head codex/issue-3-repair-bootstrap --base main --state open \
            --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head codex/issue-3-repair-bootstrap \
              --title 'Complete deterministic automatic three-way coarsening' \
              --body 'Closes #3. Adds compatible-witness bootstrap aggregation, bounded deterministic repair, hard structural gates, dense-calibrated matrix-free complete-cycle screening, recursive fail-closed hierarchy planning, preserved negative evidence, and frozen one-level and recursive unseen graph-cover gates.'
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head codex/issue-3-repair-bootstrap --base main --state open \
              --json number --jq '.[0].number')"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Comment final report and merge
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" \
            --body-file docs/ISSUE3_FINAL_RESULTS.md
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --squash \
            --subject 'Complete deterministic automatic three-way coarsening' \
            --body 'Resolve issue #3 with frozen automatic-to-oracle evidence, preserved falsification evidence, and fail-closed recursive hierarchy construction.'
          gh issue close 3 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment 'Resolved by the merged automatic-coarsening completion PR. See docs/ISSUE3_FINAL_RESULTS.md and benchmarks/results/2026-09-04.'

      - name: Report any failed authoritative gate
        if: failure() && steps.preflight.outputs.already_complete != 'true'
        run: |
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" \
            --body "The authoritative issue #3 completion gate failed without merging or changing the frozen policies. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
