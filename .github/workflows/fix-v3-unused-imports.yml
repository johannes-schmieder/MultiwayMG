name: One-time v3 import repair

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
          fetch-depth: 0
      - name: Remove unused imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/multiway-mg/examples/issue3_cycle_holdout_v3.rs')
          text = path.read_text()
          text = text.replace('    CycleQualityDecision, CycleQualityOptions, CycleQualityReport, CycleSmootherKind,\n', '    CycleQualityOptions, CycleSmootherKind,\n')
          text = text.replace('    SelectedTwoGridCycle, SpectralAnalysisOptions, SymmetricMapPreconditioner,\n', '    SpectralAnalysisOptions, SymmetricMapPreconditioner,\n')
          path.write_text(text)
          PY
          rm .github/workflows/fix-v3-unused-imports.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused v3 holdout imports"
          git push origin HEAD:codex/issue-3-completion-clean
