name: One-time supplied-map hierarchy integration

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Add validated constructor and format
        run: |
          python3 scripts/add_cycle_hierarchy_from_maps.py
          cargo fmt --all
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Add validated supplied-map cycle hierarchy constructor"
          git push origin HEAD:codex/issue-3-completion-clean
