name: Apply issue 3 secondary-screen portfolio

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Repair the exact-source patch and apply it
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_issue3_secondary_portfolio.py")
          text = path.read_text()
          text = text.replace(
              '        "retained_report_bytes_estimate: work.retained_report_bytes_estimate(),",',
              '        "retained_report_bytes_estimate: work.retained_round_report_bytes_estimate(),",',
          )
          text = text.replace(
              '''retained_report_bytes_estimate: work
                  .retained_report_bytes_estimate()
                  .saturating_add(''',
              '''retained_report_bytes_estimate: work
                  .retained_round_report_bytes_estimate()
                  .saturating_add(''',
          )
          path.write_text(text)
          PY
          python3 scripts/apply_issue3_secondary_portfolio.py
          cargo fmt --all
      - name: Validate all targets and focused portfolio tests
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p multiway-mg --all-features --test bootstrap_portfolio
          cargo test --locked -p multiway-mg --all-features --test bootstrap
          cargo test --locked -p multiway-mg --all-features --test repair
      - name: Remove one-time files and commit exact formatter output
        run: |
          rm .github/workflows/apply-secondary-portfolio.yml
          rm scripts/apply_issue3_secondary_portfolio.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add two-stage bootstrap acceptance portfolio"
          git push origin HEAD:codex/issue-3-repair-bootstrap
