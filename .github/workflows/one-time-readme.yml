name: Apply requested README clarification

on:
  push:
    branches:
      - codex/initial-threeway-prototype

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - name: Promote staged README and remove this workflow
        run: |
          mv README.next.md README.md
          rm .github/workflows/one-time-readme.yml
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.next.md .github/workflows/one-time-readme.yml
          git commit -m "Clarify MultiwayMG problem, goal, and package relationships"
          git push origin HEAD:codex/initial-threeway-prototype
