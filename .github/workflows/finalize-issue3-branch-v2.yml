name: Finalize issue 3 branch v2

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Promote staged documents when present
        shell: bash
        run: |
          if test -f README.issue3-final.md; then mv README.issue3-final.md README.md; fi
          if test -f docs/ROADMAP.issue3-final.md; then mv docs/ROADMAP.issue3-final.md docs/ROADMAP.md; fi
          if test -f CHANGELOG.issue3-final.md; then mv CHANGELOG.issue3-final.md CHANGELOG.md; fi
      - name: Remove obsolete one-time orchestration and patch helpers
        run: |
          rm -f \
            .github/workflows/advance-issue3-after-recursive-validation.yml \
            .github/workflows/dispatch-issue3-v2-result.yml \
            .github/workflows/finish-issue3.yml \
            .github/workflows/issue3-authoritative-finalizer.yml \
            .github/workflows/run-issue3-cycle-v2.yml \
            .github/workflows/run-portfolio-holdout.yml \
            .github/workflows/validate-issue3-cycle-hierarchy.yml \
            .github/workflows/finalize-issue3-branch.yml \
            scripts/add_bootstrap_timing.py \
            scripts/finalize_issue3_docs.py \
            scripts/finalize_cycle_split_development.py
      - name: Verify final documentation and evidence
        run: |
          grep -q 'Issue #3: automatic coarse-space construction — completed with a mixed result' README.md
          grep -q 'Tracked by completed issue #3' docs/ROADMAP.md
          test -f docs/ISSUE3_FINAL_RESULTS.md
          test -f docs/ADR_0001_ISSUE3_AUTOMATIC_COARSENING.md
          test -f docs/ISSUE3_FINAL_POLICY.md
          test -f docs/ISSUE3_CYCLE_V3_HOLDOUT_RESULTS.md
          test -f docs/ISSUE3_RECURSIVE_V1_RESULTS.md
          test -f benchmarks/results/2026-09-04/issue3-cycle-v3.sha256
          test -f benchmarks/results/2026-09-04/issue3-recursive-v1.sha256
          test -f benchmarks/results/2026-09-04/issue3-cycle-split-development.sha256
      - name: Run full Rust validation
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Re-run deterministic issue 3 completion gate
        run: python3 scripts/run_issue3_completion_gate.py
      - name: Require only permanent CI plus this one-time workflow
        shell: bash
        run: |
          unexpected="$(find .github/workflows -maxdepth 1 -type f \
            ! -name ci.yml ! -name finalize-issue3-branch-v2.yml -printf '%f\n' | sort)"
          test -z "$unexpected" || { printf 'unexpected workflows:\n%s\n' "$unexpected"; exit 1; }
      - name: Remove this workflow and commit final branch state
        shell: bash
        run: |
          rm .github/workflows/finalize-issue3-branch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize issue 3 automatic-coarsening result"
          git push origin HEAD:codex/issue-3-completion-clean
