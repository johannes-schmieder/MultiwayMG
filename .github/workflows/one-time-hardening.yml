name: One-time numerical hardening

on:
  push:
    branches:
      - codex/initial-threeway-prototype

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce symmetric smoothing and generate lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/multiway-mg/src/hierarchy.rs")
          text = path.read_text()
          marker = "        Ok(())\n    }\n}\n\n/// Observable dimensions"
          insertion = """        if self.pre_sweeps != self.post_sweeps {
              return Err(MultiwayError::InvalidOption {
                  name: \"smoothing_sweeps\",
                  message: format!(
                      \"pre_sweeps ({}) must equal post_sweeps ({}) for a symmetric V-cycle\",
                      self.pre_sweeps, self.post_sweeps
                  ),
              });
          }
  """
          if insertion.strip() not in text:
              if text.count(marker) != 1:
                  raise SystemExit("hierarchy validation marker was not unique")
              text = text.replace(marker, insertion + marker)
              path.write_text(text)
          PY
          cargo generate-lockfile
          cargo fmt --all
      - name: Validate repaired tree
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test --workspace --no-default-features
      - name: Commit source and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates
          git commit -m "Harden symmetric hierarchy and pin dependency graph"
          git push origin HEAD:codex/initial-threeway-prototype
