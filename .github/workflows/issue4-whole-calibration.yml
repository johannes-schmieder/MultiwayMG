name: Archive issue 4 whole-system calibration

on:
  push:
    branches: [codex/issue-4-whole-calibration]
    paths: [.github/workflows/issue4-whole-calibration.yml]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    name: Verify and archive calibration artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-4-whole-calibration
      - name: Retrieve fixed calibration artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/johannes-schmieder/MultiwayMG/actions/artifacts/9959613244/zip \
            -o "$RUNNER_TEMP/issue4-whole-calibration.zip"
      - name: Verify bytes, validator, and provenance
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import zipfile

          archive = Path(os.environ['RUNNER_TEMP']) / 'issue4-whole-calibration.zip'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == '9223762bd466191ce282e499bd6cc606b62ca2d75314f33e1a3716350216f149', digest
          expected = {
              'SUMMARY.md': 'dfbf5a452f3974c04c38175e1b4718c8d4ad68cd3c5a558f0716c2c642d2be64',
              'checksums.sha256': '0de6d9a13c8303545897dc2d77551adf9b61e76f4b5c2e6065f093cbf0e017ec',
              'metadata.txt': '16dc856ad24a65ee53253b70831470c817bf5b6b1df310d204705c0773746cb7',
              'process-resources.txt': '1b1dc1af61bd49d119df7c3b34a6a6c33f0245b0c78fab507dc4b4fdddbffcaa',
              'warnings.txt': 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
              'whole-system.tsv': '909dfe11cb7be03b0f5ffbf1dff27e0c6377a17e1f54ed7809f10756ff96dab3',
          }
          destination = Path('benchmarks/results/2026-09-04/issue4-whole-system-calibration')
          assert not destination.exists(), 'Refusing to overwrite an existing evidence archive'
          with zipfile.ZipFile(archive) as bundle:
              assert set(bundle.namelist()) == set(expected) and len(bundle.namelist()) == len(expected)
              assert bundle.testzip() is None
              content = {name: bundle.read(name) for name in expected}
          for name, wanted in expected.items():
              got = hashlib.sha256(content[name]).hexdigest()
              assert got == wanted, (name, got, wanted)
          metadata_lines = content['metadata.txt'].decode().splitlines()
          assert metadata_lines[0] == '3f3b56c47b1f3f50cc88d1d313c1cd0a0e159f72'
          destination.mkdir(parents=True)
          for name, data in content.items():
              (destination / name).write_bytes(data)
          sys.path.insert(0, 'scripts')
          from summarize_issue4_whole_system import load, validate, render
          rows = load(destination / 'whole-system.tsv')
          errors = validate(rows, 'calibration')
          assert len(rows) == 288 and not errors, errors
          assert render(rows, errors).encode() == content['SUMMARY.md'], 'Summary differs from frozen evidence'
          manifest = {
              'source_commit': '3f3b56c47b1f3f50cc88d1d313c1cd0a0e159f72',
              'source_base_main': '12688bdf3b7985dd04daa8d62ad775508f7c02c5',
              'workflow_run': 33934212856,
              'artifact_id': 9959613244,
              'artifact_name': 'issue-4-whole-system-calibration',
              'artifact_zip_sha256': digest,
              'files_sha256': expected,
              'profile': 'calibration',
              'note': 'Byte-preserved larger calibration evidence; not a fresh holdout or production qualification.',
          }
          (destination / 'SOURCE.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Remove one-time workflow and commit evidence
        run: |
          git rm .github/workflows/issue4-whole-calibration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/results/2026-09-04/issue4-whole-system-calibration
          git commit -m 'Archive verified issue 4 whole-system calibration evidence'
          git push origin HEAD:codex/issue-4-whole-calibration
