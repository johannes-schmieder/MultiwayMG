name: Issue 4 apply checkpoint

on:
  push:
    branches:
      - codex/issue-4-pair-solver-economics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply compressed development checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pending patch and commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ready=(.issue4/*.ready)
          if (( ${#ready[@]} == 0 )); then
            echo "No complete issue-4 checkpoint is pending."
            exit 0
          fi
          if (( ${#ready[@]} != 1 )); then
            echo "Expected exactly one ready marker, found ${#ready[@]}." >&2
            exit 1
          fi
          prefix="${ready[0]%.ready}"
          parts=("${prefix}".b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "No checkpoint parts found for ${prefix}." >&2
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode | gzip -dc | git apply --index
          message="$(cat "${ready[0]}")"
          git rm "${ready[0]}" "${parts[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${message:-Apply issue 4 development checkpoint}"
          git push
