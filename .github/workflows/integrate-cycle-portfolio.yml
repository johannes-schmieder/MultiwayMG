name: Integrate complete-cycle bootstrap portfolio

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: full

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Wire public API and repair move ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/multiway-mg/src/lib.rs')
          text = lib.read_text()
          if 'mod cycle_portfolio;' not in text:
              text = text.replace('mod compatible_gate;\nmod cycle_probe;', 'mod compatible_gate;\nmod cycle_portfolio;\nmod cycle_probe;')
          export = '''pub use cycle_portfolio::{
              CyclePortfolioBuildTiming, CyclePortfolioCandidateSource, CyclePortfolioEvaluation,
              CyclePortfolioStructuralMetrics, CyclePortfolioStructuralRejection,
              CyclePortfolioWorkReport, CycleScreenedBootstrapResult,
              build_cycle_screened_bootstrap_aggregation,
              build_cycle_screened_bootstrap_aggregation_with_timing,
          };
          '''
          if 'pub use cycle_portfolio::' not in text:
              text = text.replace('pub use cycle_probe::{', export + 'pub use cycle_probe::{')
          lib.write_text(text)

          portfolio = Path('crates/multiway-mg/src/cycle_portfolio.rs')
          text = portfolio.read_text()
          old = '''    let cycle_screen = cycle_start.elapsed();
              let result = CycleScreenedBootstrapResult {
          '''
          new = '''    let cycle_screen = cycle_start.elapsed();
              let candidate_maps_considered = evaluations.len();
              let result = CycleScreenedBootstrapResult {
          '''
          if old not in text:
              raise SystemExit('cycle portfolio result marker not found')
          text = text.replace(old, new, 1)
          old = '''            candidate_maps_considered: cycle_builds_attempted.saturating_add(
                          evaluations
                              .iter()
                              .filter(|evaluation| evaluation.structural_rejection.is_some())
                              .count(),
                      ),
          '''
          if old not in text:
              raise SystemExit('candidate count block not found')
          text = text.replace(old, '            candidate_maps_considered,\n', 1)
          portfolio.write_text(text)
          PY
          cargo fmt --all
      - name: Strict lint and focused tests
        shell: bash
        run: |
          rm -rf diagnostics/cycle-portfolio
          mkdir -p diagnostics/cycle-portfolio
          set +e
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings \
            > diagnostics/cycle-portfolio/clippy.log 2>&1
          clippy_status=$?
          cargo test --locked -p multiway-mg --all-features --test cycle_probe -- --nocapture \
            > diagnostics/cycle-portfolio/cycle-probe-test.log 2>&1
          probe_status=$?
          cargo test --locked -p multiway-mg --all-features --test cycle_portfolio -- --nocapture \
            > diagnostics/cycle-portfolio/cycle-portfolio-test.log 2>&1
          portfolio_status=$?
          printf 'clippy_status=%s\ncycle_probe_status=%s\ncycle_portfolio_status=%s\n' \
            "$clippy_status" "$probe_status" "$portfolio_status" \
            > diagnostics/cycle-portfolio/status.txt
          if [ "$clippy_status" -eq 0 ] && [ "$probe_status" -eq 0 ] && [ "$portfolio_status" -eq 0 ]; then
            printf 'passed\n' > diagnostics/cycle-portfolio/verdict.txt
          else
            printf 'failed\n' > diagnostics/cycle-portfolio/verdict.txt
          fi
          cat diagnostics/cycle-portfolio/status.txt
          tail -n 200 diagnostics/cycle-portfolio/clippy.log || true
          tail -n 200 diagnostics/cycle-portfolio/cycle-probe-test.log || true
          tail -n 200 diagnostics/cycle-portfolio/cycle-portfolio-test.log || true
          exit 0
      - name: Commit exact source and diagnostics
        run: |
          rm .github/workflows/integrate-cycle-portfolio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate complete-cycle bootstrap candidate screening"
          git push origin HEAD:codex/issue-3-repair-bootstrap
