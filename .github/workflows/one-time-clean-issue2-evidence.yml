name: Remove duplicate issue 2 working directories

on:
  push:
    branches:
      - codex/issue-2-completion

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-2-completion
          fetch-depth: 0
      - name: Remove temporary rerun trees
        run: |
          rm -rf issue2-a issue2-b
          rm .github/workflows/one-time-clean-issue2-evidence.yml
      - name: Commit repository cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate issue 2 working directories"
          git push origin HEAD:codex/issue-2-completion
