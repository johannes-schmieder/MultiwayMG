name: Rust CI

on:
  push:
    branches:
      - codex/initial-threeway-prototype

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Apply exact Rust 1.85 formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Apply Rust 1.85 formatting"
          git push origin HEAD:codex/initial-threeway-prototype
