name: Rust diagnostic

on:
  push:
    branches:
      - codex/initial-threeway-prototype

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  diagnose:
    name: Format and preserve difficult-scaling output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact formatter output
        run: cargo fmt --all
      - name: Compile and lint formatted source
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run difficult probe without masking partial output
        shell: bash
        run: |
          set +e
          cargo run --locked --release -p multiway-mg --example difficult_scaling_probe --all-features \
            > difficult-scaling-probe.tsv 2> difficult-scaling-probe.stderr
          status=$?
          echo "$status" > difficult-scaling-probe.status
          cat difficult-scaling-probe.tsv
          cat difficult-scaling-probe.stderr >&2
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficult-scaling-diagnostic
          path: |
            difficult-scaling-probe.tsv
            difficult-scaling-probe.stderr
            difficult-scaling-probe.status
          if-no-files-found: error
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Apply Rust 1.85 formatting for difficult scaling"
          git push origin HEAD:codex/initial-threeway-prototype
