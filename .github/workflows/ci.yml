name: Rust CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  harden:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/initial-threeway-prototype'
    name: Apply one-time numerical hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce symmetric smoothing and pin dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/multiway-mg/src/hierarchy.rs")
          text = path.read_text()
          marker = "        Ok(())\n    }\n}\n\n/// Observable dimensions"
          insertion = """        if self.pre_sweeps != self.post_sweeps {
              return Err(MultiwayError::InvalidOption {
                  name: \"smoothing_sweeps\",
                  message: format!(
                      \"pre_sweeps ({}) must equal post_sweeps ({}) for a symmetric V-cycle\",
                      self.pre_sweeps, self.post_sweeps
                  ),
              });
          }
  """
          if insertion.strip() not in text:
              if text.count(marker) != 1:
                  raise SystemExit("hierarchy validation marker was not unique")
              path.write_text(text.replace(marker, insertion + marker))
          PY
          cargo generate-lockfile
          cargo fmt --all
      - name: Validate hardened tree
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test --workspace --no-default-features
      - name: Commit source and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates
          git commit -m "Harden symmetric hierarchy and pin dependency graph"
          git push origin HEAD:codex/initial-threeway-prototype

  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Test minimal feature set
        run: cargo test --workspace --no-default-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  feasibility:
    name: Manufactured feasibility probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run release feasibility example
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p multiway-mg --example feasibility --all-features \
            | tee feasibility.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feasibility-output
          path: feasibility.txt
          if-no-files-found: error
