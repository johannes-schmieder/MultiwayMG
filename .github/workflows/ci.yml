name: Rust CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --workspace --all-features
      - name: Test minimal feature set
        run: cargo test --locked --workspace --no-default-features
      - name: Test evidence validators
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test prepared benchmark input boundary
        run: cargo test --locked -p multiway-mg --all-features --example prepared_serial_benchmark
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  feasibility:
    name: Manufactured feasibility probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run planted feasibility probe
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p multiway-mg --example feasibility --all-features \
            | tee feasibility.txt
      - name: Run structural feasibility matrix
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p multiway-mg --example feasibility_matrix --all-features \
            | tee feasibility-matrix.tsv
      - name: Run recursive scaling probe
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p multiway-mg --example scaling_probe --all-features \
            | tee scaling-probe.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: feasibility-output
          path: |
            feasibility.txt
            feasibility-matrix.tsv
            scaling-probe.tsv
          if-no-files-found: error

  oracle-spectral:
    name: Oracle quotient-space spectral matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run oracle spectral matrix
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p multiway-mg --example oracle_spectral_matrix --all-features \
            | tee oracle-spectral-matrix.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-spectral-output
          path: oracle-spectral-matrix.tsv
          if-no-files-found: error

  compatible-relaxation:
    name: Compatible-relaxation map-quality matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run compatible-relaxation matrix
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p multiway-mg --example compatible_relaxation_matrix --all-features \
            | tee compatible-relaxation-matrix.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: compatible-relaxation-output
          path: compatible-relaxation-matrix.tsv
          if-no-files-found: error

  issue-2-completion:
    name: Issue 2 deterministic two-grid and resolution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic matrices twice
        run: |
          mkdir -p issue2-a issue2-b
          for output in issue2-a issue2-b; do
            cargo run --locked --release -p multiway-mg \
              --example issue2_two_grid_matrix --all-features -- "$output"
            cargo run --locked --release -p multiway-mg \
              --example issue2_resolution_matrix --all-features -- "$output"
          done
      - name: Verify byte-identical deterministic evidence
        run: |
          for file in \
            issue2-two-grid-matrix.tsv \
            issue2-pcg-traces.tsv \
            issue2-resolution-matrix.tsv \
            issue2-resolution-traces.tsv; do
            cmp "issue2-a/$file" "issue2-b/$file"
          done
      - name: Run phase-separated setup and apply diagnostics
        run: |
          cargo run --locked --release -p multiway-mg \
            --example issue2_setup_cost_matrix --all-features -- issue2-a
      - name: Evaluate issue 2 acceptance gates
        run: |
          python3 scripts/summarize_issue2_completion.py \
            issue2-a issue2-a/ISSUE2_FINAL_RESULTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: issue-2-completion-output
          path: |
            issue2-a/*.tsv
            issue2-a/ISSUE2_FINAL_RESULTS.md
          if-no-files-found: error

  issue-4-pair-local:
    name: Issue 4 certified pair-local economics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAYON_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Record reproducibility metadata
        run: |
          mkdir -p issue4-output
          {
            git rev-parse HEAD
            echo "event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
            rustc --version --verbose
            uname -a
            lscpu
            echo "RAYON_NUM_THREADS=$RAYON_NUM_THREADS"
            echo "OMP_NUM_THREADS=$OMP_NUM_THREADS OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS"
            grep -E '^(cmg|schwarz-precond|within) =' Cargo.toml
          } > issue4-output/metadata.txt
      - name: Test pair-local algebra and accounting
        run: |
          cargo test --locked -p multiway-mg --all-features --example issue4_pair_local
          python3 -m unittest discover -s scripts -p test_issue4_pair_local_summary.py
      - name: Build release benchmark
        run: cargo build --locked --release -p multiway-mg --all-features --example issue4_pair_local
      - name: Run frozen smoke matrix
        run: |
          /usr/bin/time -v -o issue4-output/process-resources.txt \
            target/release/examples/issue4_pair_local issue4-output smoke \
            2> issue4-output/warnings.txt
      - name: Validate evidence and report conditional crossovers
        run: |
          python3 scripts/summarize_issue4_pair_local.py \
            issue4-output/pair-local.tsv issue4-output/SUMMARY.md
          (cd issue4-output && sha256sum pair-local.tsv metadata.txt > checksums.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-4-pair-local-output
          path: issue4-output/
          if-no-files-found: error

  issue-4-whole-system:
    name: Issue 4 whole-system Schwarz work matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAYON_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Record reproducibility metadata
        run: |
          mkdir -p issue4-whole-output
          {
            git rev-parse HEAD
            echo "event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
            rustc --version --verbose
            uname -a
            lscpu
            echo "RAYON_NUM_THREADS=$RAYON_NUM_THREADS"
            echo "OMP_NUM_THREADS=$OMP_NUM_THREADS OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS"
            grep -E '^(cmg|schwarz-precond|within) =' Cargo.toml
          } > issue4-whole-output/metadata.txt
      - name: Test whole-system harness and evidence validator
        run: |
          cargo test --locked -p multiway-mg --all-features --example issue4_whole_system
          python3 -m unittest discover -s scripts -p test_issue4_whole_system_summary.py
      - name: Build release benchmark
        run: cargo build --locked --release -p multiway-mg --all-features --example issue4_whole_system
      - name: Run whole-system smoke matrix
        run: |
          /usr/bin/time -v -o issue4-whole-output/process-resources.txt \
            target/release/examples/issue4_whole_system issue4-whole-output smoke \
            2> issue4-whole-output/warnings.txt
      - name: Validate evidence and summarize work ratios
        run: |
          python3 scripts/summarize_issue4_whole_system.py \
            issue4-whole-output/whole-system.tsv issue4-whole-output/SUMMARY.md
          (cd issue4-whole-output && sha256sum whole-system.tsv metadata.txt > checksums.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-4-whole-system-output
          path: issue4-whole-output/
          if-no-files-found: error

  prepared-serial:
    name: Prepared serial evidence (${{ matrix.policy }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        policy: [native, gated]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Collect the frozen serial development smoke
        run: python3 scripts/prepared_serial.py "$RUNNER_TEMP/prepared-serial-${{ matrix.policy }}-smoke" --profile smoke --policy "${{ matrix.policy }}"
      - name: Validate complete evidence, including scientific rejections
        run: python3 scripts/validate_prepared_serial.py "$RUNNER_TEMP/prepared-serial-${{ matrix.policy }}-smoke"
      - name: Require complete candidate-route certification
        if: matrix.policy == 'gated'
        run: python3 scripts/validate_prepared_serial.py "$RUNNER_TEMP/prepared-serial-gated-smoke" --require-certification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-serial-${{ matrix.policy }}-smoke
          path: ${{ runner.temp }}/prepared-serial-${{ matrix.policy }}-smoke/
          if-no-files-found: error


  prepared-kernel-profile:
    name: Prepared serial diagnostic kernel profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Collect the explicit diagnostic smoke
        run: python3 scripts/prepared_kernel_profile.py "$RUNNER_TEMP/prepared-kernel-profile-smoke" --profile smoke
      - name: Validate complete profiles and independent certificates
        run: python3 scripts/validate_prepared_kernel_profile.py "$RUNNER_TEMP/prepared-kernel-profile-smoke" --require-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-kernel-profile-smoke
          path: ${{ runner.temp }}/prepared-kernel-profile-smoke/
          if-no-files-found: error


  prepared-layout:
    name: Complete paired grouped-layout smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build the debug layout protocol fixture
        run: cargo build --locked -p multiway-mg --no-default-features --features lsmr --example prepared_serial_benchmark
      - name: Verify debug protocol, original numerical identity and failures
        run: python3 scripts/check_prepared_layout_probe.py target/debug/examples/prepared_serial_benchmark "$RUNNER_TEMP/prepared-layout-protocol-debug"
      - name: Collect committed uninstrumented five-layout smoke
        run: python3 scripts/prepared_layout.py "$RUNNER_TEMP/prepared-layout-smoke" --profile smoke
      - name: Require full accounting, exact pairing and independent certification
        run: python3 scripts/validate_prepared_layout.py "$RUNNER_TEMP/prepared-layout-smoke" --require-certification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-layout-smoke
          path: ${{ runner.temp }}/prepared-layout-smoke/
          if-no-files-found: error
