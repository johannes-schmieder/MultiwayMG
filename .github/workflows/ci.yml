name: Rust diagnostic

on:
  push:
    branches:
      - codex/initial-threeway-prototype

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  diagnose:
    name: Format and preserve difficult-scaling output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Raise the experimental terminal cap and apply rustfmt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/multiway-mg/examples/difficult_scaling_probe.rs")
          text = path.read_text(encoding="utf-8")
          old = "terminal_dimension: 60,"
          new = "terminal_dimension: 96,"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("difficult-probe terminal setting was not found")
          PY
          cargo fmt --all
      - name: Compile and lint formatted source
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run difficult probe without masking partial output
        shell: bash
        run: |
          set +e
          cargo run --locked --release -p multiway-mg --example difficult_scaling_probe --all-features \
            > difficult-scaling-probe.tsv 2> difficult-scaling-probe.stderr
          status=$?
          echo "$status" > difficult-scaling-probe.status
          cat difficult-scaling-probe.tsv
          cat difficult-scaling-probe.stderr >&2
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficult-scaling-diagnostic
          path: |
            difficult-scaling-probe.tsv
            difficult-scaling-probe.stderr
            difficult-scaling-probe.status
          if-no-files-found: error
      - name: Commit formatted source and terminal setting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Raise difficult-probe terminal cap and apply rustfmt"
          git push origin HEAD:codex/initial-threeway-prototype
