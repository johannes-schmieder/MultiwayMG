name: Rust CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Test minimal feature set
        run: cargo test --workspace --no-default-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  feasibility:
    name: Manufactured feasibility probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run release feasibility example
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p multiway-mg --example feasibility --all-features \
            | tee feasibility.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feasibility-output
          path: feasibility.txt
          if-no-files-found: error
