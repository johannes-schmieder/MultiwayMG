name: Add frozen issue 3 portfolio holdout

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Insert fixtures and format
        run: |
          python3 scripts/add_issue3_portfolio_holdout.py
          cargo fmt --all
      - name: Remove one-time files and commit
        run: |
          rm .github/workflows/add-portfolio-holdout.yml
          rm scripts/add_issue3_portfolio_holdout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Freeze second issue 3 portfolio holdout fixtures"
          git push origin HEAD:codex/issue-3-repair-bootstrap
