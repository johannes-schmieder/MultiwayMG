name: Validate issue 3 cycle-screened hierarchy

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: full

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Wire recursive API and apply mechanical fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/multiway-mg/src/lib.rs')
          text = lib.read_text()
          if 'mod cycle_hierarchy;' not in text:
              text = text.replace(
                  'mod compatible_gate;\nmod cycle_portfolio;',
                  'mod compatible_gate;\nmod cycle_hierarchy;\nmod cycle_portfolio;',
              )
          if 'pub use cycle_hierarchy::' not in text:
              export = '''pub use cycle_hierarchy::{
              CycleScreenedHierarchyLevelReport, CycleScreenedHierarchyOptions,
              CycleScreenedHierarchyPlan, CycleScreenedHierarchyStopReason,
              CycleScreenedMapHierarchy,
          };
          '''
              text = text.replace('pub use cycle_portfolio::{', export + 'pub use cycle_portfolio::{')
          lib.write_text(text)

          test = Path('crates/multiway-mg/tests/cycle_hierarchy.rs')
          text = test.read_text().replace(
              'assert_eq!(reconstructed, *coarse);',
              'assert_eq!(&reconstructed, coarse);',
          )
          test.write_text(text)

          cargo = Path('crates/multiway-mg/Cargo.toml')
          text = cargo.read_text()
          for name in ('issue3_cycle_holdout',):
              if f'name = "{name}"' not in text:
                  marker = '\n[lints]\nworkspace = true\n'
                  block = f'\n[[example]]\nname = "{name}"\nrequired-features = ["cmg"]\n'
                  if marker not in text:
                      raise SystemExit('Cargo insertion marker missing')
                  text = text.replace(marker, block + marker, 1)
          cargo.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --fix --allow-dirty --allow-staged \
            --locked --workspace --all-targets --all-features
          cargo fmt --all
      - name: Run strict validation
        shell: bash
        run: |
          rm -rf diagnostics/recursive-cycle-validation
          mkdir -p diagnostics/recursive-cycle-validation
          set +e
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings \
            > diagnostics/recursive-cycle-validation/clippy.log 2>&1
          clippy_status=$?
          for test in \
            cycle_probe \
            cycle_probe_calibration \
            cycle_portfolio \
            cycle_hierarchy \
            bootstrap_portfolio \
            bootstrap \
            repair \
            bootstrap_hierarchy \
            compatible \
            compatible_gate; do
            cargo test --locked -p multiway-mg --all-features --test "$test" -- --nocapture \
              > "diagnostics/recursive-cycle-validation/${test}.log" 2>&1
            printf '%s_status=%s\n' "$test" "$?" \
              >> diagnostics/recursive-cycle-validation/status.txt
          done
          printf 'clippy_status=%s\n' "$clippy_status" \
            >> diagnostics/recursive-cycle-validation/status.txt
          if [ "$clippy_status" -eq 0 ] && \
             ! grep -Eq '_status=[1-9][0-9]*' diagnostics/recursive-cycle-validation/status.txt; then
            printf 'passed\n' > diagnostics/recursive-cycle-validation/verdict.txt
          else
            printf 'failed\n' > diagnostics/recursive-cycle-validation/verdict.txt
          fi
          cat diagnostics/recursive-cycle-validation/status.txt
          cat diagnostics/recursive-cycle-validation/verdict.txt
          for log in diagnostics/recursive-cycle-validation/*.log; do
            echo "===== $log ====="
            tail -n 160 "$log" || true
          done
          exit 0
      - name: Commit exact validation state
        run: |
          rm -f .github/workflows/validate-issue3-cycle-hierarchy.yml
          rm -f .github/workflows/validate-cycle-screening.yml
          rm -f .github/workflows/integrate-cycle-portfolio.yml
          rm -f .github/workflows/repair-cycle-probe.yml
          rm -f .github/workflows/format-test-cycle-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate recursively cycle-screened automatic hierarchy"
          git push origin HEAD:codex/issue-3-repair-bootstrap
