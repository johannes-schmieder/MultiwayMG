name: One-time issue 2 spectral repair

on:
  push:
    branches:
      - codex/issue-2-oracle-spectral-matrix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-2-oracle-spectral-matrix
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply repair and rustfmt
        run: |
          python3 scripts/repair_issue2_spectral.py
          cargo fmt --all
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Fix quotient eigenpair ordering and range-leakage tests"
          git push origin HEAD:codex/issue-2-oracle-spectral-matrix
