name: One-time formatting repair

on:
  push:
    branches:
      - codex/initial-threeway-prototype

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/initial-threeway-prototype
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply known source repair and rustfmt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hierarchy = Path("crates/multiway-mg/src/hierarchy.rs")
          text = hierarchy.read_text()
          text = text.replace(
              "pub const fn finest_problem(&self) -> &ThreeWayProblem",
              "pub fn finest_problem(&self) -> &ThreeWayProblem",
          )
          hierarchy.write_text(text)
          PY
          cargo fmt --all
      - name: Commit exact rustfmt output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Fix initial compiler issue and apply rustfmt"
          git push origin HEAD:codex/initial-threeway-prototype
