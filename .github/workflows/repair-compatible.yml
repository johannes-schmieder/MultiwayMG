name: One-time compatible-relaxation repair

on:
  push:
    branches:
      - codex/issue-3-compatible-relaxation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-compatible-relaxation
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply repair and rustfmt
        run: |
          python3 scripts/repair_compatible_compile.py
          cargo fmt --all
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Fix compatible-relaxation accumulator type and format"
          git push origin HEAD:codex/issue-3-compatible-relaxation
