name: One-time issue 3 support lint repair

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Mark shared example fixture factories intentionally reusable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/multiway-mg/examples/support/issue3_fixtures.rs")
          text = path.read_text()
          attribute = "#![allow(dead_code)]\n\n"
          if not text.startswith(attribute):
              path.write_text(attribute + text)
          PY
          cargo fmt --all
      - name: Commit exact source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Allow shared issue 3 fixture subsets across examples"
          git push origin HEAD:codex/issue-3-completion-clean
