name: Diagnose issue 3 portfolio holdout

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Capture check and lint output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          cargo check --locked -p multiway-mg --example issue3_portfolio_holdout --all-features \
            > diagnostics/issue3-portfolio-check.log 2>&1
          check_status=$?
          cargo clippy --locked -p multiway-mg --example issue3_portfolio_holdout --all-features -- -D warnings \
            > diagnostics/issue3-portfolio-clippy.log 2>&1
          clippy_status=$?
          printf 'check_status=%s\nclippy_status=%s\n' "$check_status" "$clippy_status" \
            > diagnostics/issue3-portfolio-status.txt
          cat diagnostics/issue3-portfolio-status.txt
          tail -n 120 diagnostics/issue3-portfolio-check.log
          tail -n 120 diagnostics/issue3-portfolio-clippy.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics
          git commit -m "Capture portfolio holdout compile diagnostics"
          git push origin HEAD:codex/issue-3-repair-bootstrap
