name: Dispatch frozen issue 3 v2 result

on:
  push:
    branches:
      - codex/issue-3-repair-bootstrap

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-repair-bootstrap
          fetch-depth: 0
      - name: Wait for and load the immutable v2 result
        run: |
          for attempt in $(seq 1 60); do
            git fetch origin codex/issue-3-repair-bootstrap
            git reset --hard origin/codex/issue-3-repair-bootstrap
            if [ -f benchmarks/results/2026-09-04/issue3-cycle-gate-status.txt ]; then
              break
            fi
            sleep 10
          done
          test -f benchmarks/results/2026-09-04/issue3-cycle-gate-status.txt
          status="$(tr -d '[:space:]' < benchmarks/results/2026-09-04/issue3-cycle-gate-status.txt)"
          test "$status" = 0 -o "$status" = 1
          printf 'status=%s\n' "$status" >> "$GITHUB_ENV"
      - name: Record an unambiguous branch marker
        run: |
          rm -f benchmarks/results/2026-09-04/ISSUE3_CYCLE_V2_PASS \
                benchmarks/results/2026-09-04/ISSUE3_CYCLE_V2_FAIL
          if [ "$status" = 0 ]; then
            printf 'The frozen issue3-cycle-portfolio-v2 scientific gate passed.\n' \
              > benchmarks/results/2026-09-04/ISSUE3_CYCLE_V2_PASS
          else
            printf 'The frozen issue3-cycle-portfolio-v2 scientific gate failed.\n' \
              > benchmarks/results/2026-09-04/ISSUE3_CYCLE_V2_FAIL
          fi
          rm .github/workflows/dispatch-issue3-v2-result.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record frozen issue 3 v2 gate outcome"
          git push origin HEAD:codex/issue-3-repair-bootstrap
      - name: Post the generated report to issue 3
        run: |
          {
            echo '## Frozen complete-cycle holdout v2'
            echo
            cat docs/ISSUE3_CYCLE_HOLDOUT_RESULTS.md
          } > /tmp/issue3-v2-comment.md
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue3-v2-comment.md
      - name: Keep a failed gate visible
        if: env.status != '0'
        run: exit 1
