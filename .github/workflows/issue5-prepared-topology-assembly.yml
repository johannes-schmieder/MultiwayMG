name: Assemble prepared topology source (temporary)
on:
  push:
    branches: [implementation/issue-5-prepared-topology-assembly]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Assemble and format permanent source only
        run: |
          python3 scripts/issue5_prepared_topology_assembly.py
          cargo fmt --all
          rm scripts/issue5_prepared_topology_assembly.py .github/workflows/issue5-prepared-topology-assembly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble permanent prepared topology source; not a validation receipt'
          git push origin HEAD:implementation/issue-5-prepared-topology-assembly
