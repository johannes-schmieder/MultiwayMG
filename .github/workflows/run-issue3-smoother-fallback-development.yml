name: Issue 3 observed-seed smoother fallback development

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and validate the development executable
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run the observed v2 seeds twice
        run: |
          rm -rf /tmp/issue3-smoother-a /tmp/issue3-smoother-b
          mkdir -p /tmp/issue3-smoother-a /tmp/issue3-smoother-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_smoother_fallback_development --all-features -- \
            /tmp/issue3-smoother-a
          cargo run --locked --release -p multiway-mg \
            --example issue3_smoother_fallback_development --all-features -- \
            /tmp/issue3-smoother-b
          cmp /tmp/issue3-smoother-a/issue3-smoother-fallback-development.tsv \
              /tmp/issue3-smoother-b/issue3-smoother-fallback-development.tsv
      - name: Summarize the predeclared fallback rule
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          input_path = Path('/tmp/issue3-smoother-a/issue3-smoother-fallback-development.tsv')
          output_path = Path('/tmp/issue3-smoother-a/ISSUE3_SMOOTHER_FALLBACK_DEVELOPMENT.md')
          with input_path.open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          if not rows:
              raise SystemExit('development matrix is empty')

          def flag(row, name):
              return row[name].lower() == 'true'

          def number(row, name):
              value = row[name]
              return None if value in {'NA', ''} else float(value)

          cases = sorted({row['case'] for row in rows})
          grouped = {}
          for row in rows:
              grouped[(row['case'], row['map_source'], row['smoother'])] = row

          oracle_map = [grouped[(case, 'oracle', 'symmetric-map')] for case in cases]
          oracle_pair = [grouped[(case, 'oracle', 'all-pairs-cmg')] for case in cases]
          map_oracle_pass = sum(flag(row, 'cycle_probe_accepted') for row in oracle_map)
          pair_oracle_pass = sum(flag(row, 'cycle_probe_accepted') for row in oracle_pair)

          selections = []
          candidate_sources = ['primary-bootstrap-final', 'one-shot-pair-neighborhood']
          for case in cases:
              chosen = None
              for smoother in ['symmetric-map', 'all-pairs-cmg']:
                  eligible = [
                      grouped[(case, source, smoother)]
                      for source in candidate_sources
                      if flag(grouped[(case, source, smoother)], 'structural_admissible')
                      and flag(grouped[(case, source, smoother)], 'cycle_probe_accepted')
                  ]
                  if eligible:
                      eligible.sort(
                          key=lambda row: (
                              number(row, 'probe_estimated_energy_factor'),
                              int(row['coarse_tuples']),
                              int(row['coarse_dimension']),
                              candidate_sources.index(row['map_source']),
                          )
                      )
                      chosen = eligible[0]
                      break
              selections.append((case, chosen))

          accepted = [(case, row) for case, row in selections if row is not None]
          smoother_counts = Counter(row['smoother'] for _, row in accepted)
          recoveries = sorted(
              number(row, 'oracle_improvement_recovered')
              for _, row in accepted
              if number(row, 'oracle_improvement_recovered') is not None
          )
          median_recovery = (
              recoveries[len(recoveries) // 2]
              if len(recoveries) % 2 == 1
              else 0.5 * (recoveries[len(recoveries) // 2 - 1] + recoveries[len(recoveries) // 2])
          ) if recoveries else float('nan')
          maximum_residual = max(
              number(row, 'pcg_final_relative_residual') for _, row in accepted
          ) if accepted else float('nan')
          maximum_complexity = max(
              number(row, 'two_level_tuple_complexity') for _, row in accepted
          ) if accepted else float('nan')

          lines = [
              '# Issue #3 observed-seed smoother fallback development',
              '',
              '## Scope',
              '',
              'This matrix deliberately reuses the already observed frozen-v2 seeds',
              '`700`–`709`. It is **training evidence only**, not a new holdout. The',
              'frozen v2 negative verdict and its original symmetric-MAP policy remain',
              'unchanged.',
              '',
              'The tested fallback rule is predeclared within this development run:',
              '',
              '1. keep the frozen hard structural gates and candidate maps;',
              '2. prefer an accepted one-sweep symmetric-MAP two-grid cycle;',
              '3. only when no MAP candidate passes, evaluate an all-pair fixed-CMG',
              '   two-grid cycle against the same `0.50` complete-cycle factor gate;',
              '4. within one smoother tier, select by estimated factor, then coarse',
              '   tuple count, coarse dimension, and stable map-source order.',
              '',
              '## Oracle smoother check',
              '',
              f'- Symmetric-MAP oracle cycles accepted: **{map_oracle_pass} of {len(cases)}**.',
              f'- All-pair-CMG oracle cycles accepted: **{pair_oracle_pass} of {len(cases)}**.',
              '',
              '## Deterministic fallback selections',
              '',
              '| Case | Family | Accepted | Map | Smoother | Probe factor | Condition number | Recovery | Coarse tuples |',
              '|---|---|---:|---|---|---:|---:|---:|---:|',
          ]
          for case, row in selections:
              if row is None:
                  family = next(item['family'] for item in rows if item['case'] == case)
                  lines.append(f'| {case} | {family} | No | — | — | — | — | — | — |')
              else:
                  recovery = number(row, 'oracle_improvement_recovered')
                  lines.append(
                      '| {case} | {family} | Yes | `{source}` | `{smoother}` | {factor:.3f} | {condition:.3f} | {recovery} | {tuples} |'.format(
                          case=case,
                          family=row['family'],
                          source=row['map_source'],
                          smoother=row['smoother'],
                          factor=number(row, 'probe_estimated_energy_factor'),
                          condition=number(row, 'candidate_condition'),
                          recovery='—' if recovery is None else f'{recovery:.3f}',
                          tuples=row['coarse_tuples'],
                      )
                  )
          lines.extend([
              '',
              '## Aggregate diagnostics',
              '',
              f'- Accepted cases under the fallback rule: **{len(accepted)} of {len(cases)}**.',
              '- Selected smoother counts: '
              + (', '.join(f'`{name}` {count}' for name, count in sorted(smoother_counts.items())) or 'none')
              + '.',
              f'- Median accepted oracle-improvement recovery: `{median_recovery:.3f}`.',
              f'- Maximum accepted true PCG residual: `{maximum_residual:.3e}`.',
              f'- Maximum accepted two-level tuple complexity: `{maximum_complexity:.3f}`.',
              '',
              '## Interpretation',
              '',
              'This development matrix answers only whether the v2 failure is plausibly',
              'a smoother-selection problem. A positive result justifies implementing a',
              'first-class MAP-to-pair-CMG cycle portfolio and freezing a new policy with',
              'new unseen seeds. It does not count toward the issue #3 scientific gate.',
              '',
          ])
          output_path.write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit development evidence and exact formatting
        run: |
          mkdir -p benchmarks/results/2026-09-04
          cp /tmp/issue3-smoother-a/issue3-smoother-fallback-development.tsv \
            benchmarks/results/2026-09-04/issue3-smoother-fallback-development.tsv
          cp /tmp/issue3-smoother-a/ISSUE3_SMOOTHER_FALLBACK_DEVELOPMENT.md \
            docs/ISSUE3_SMOOTHER_FALLBACK_DEVELOPMENT.md
          (
            cd benchmarks/results/2026-09-04
            sha256sum issue3-smoother-fallback-development.tsv \
              > issue3-smoother-fallback-development.sha256
          )
          rm .github/workflows/run-issue3-smoother-fallback-development.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record observed-seed smoother fallback development evidence"
          git push origin HEAD:codex/issue-3-completion-clean
