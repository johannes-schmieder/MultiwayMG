name: Assemble clean issue-5 hierarchy source
on:
  push:
    branches: [implementation/issue-5-hierarchy-assembly]
    paths: [.github/workflows/issue5-clean-hierarchy-assembly.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply bounded source edits to the verified baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def original(path, sha):
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
              return Path(path).read_text()

          path = 'crates/multiway-mg/src/cycle_hierarchy.rs'
          text = original(path, '5453cd2c1eced471c74ac470ab3fb3e4dbc4521a')
          start = text.index('    fn apply_level(&self, level: usize, rhs: &[f64]) -> Result<Vec<f64>, MultiwayError> {')
          end = text.index('\nfn add_assign(', start)
          text = text[:start] + '}\n' + text[end:]
          old = '    MultiwayError, Preconditioner, SymmetricMapPreconditioner, SymmetricTwoGridPreconditioner,\n'
          assert text.count(old) == 1
          text = text.replace(old, '    MultiwayError, SymmetricMapPreconditioner, SymmetricTwoGridPreconditioner,\n', 1)
          position = text.index('/// Options for recursive')
          text = text[:position] + 'mod workspace;\n\npub use workspace::CycleScreenedMapHierarchyWorkspace;\n\n' + text[position:]
          Path(path).write_text(text)

          path = 'crates/multiway-mg/src/lib.rs'
          text = original(path, '313ba890c8981a17945ded59fe0a0482b5021104')
          old = '    CycleScreenedHierarchyStopReason, CycleScreenedMapHierarchy,\n'
          assert text.count(old) == 1
          text = text.replace(old, '    CycleScreenedHierarchyStopReason, CycleScreenedMapHierarchy,\n    CycleScreenedMapHierarchyWorkspace,\n', 1)
          Path(path).write_text(text)

          path = 'crates/multiway-mg/src/error.rs'
          text = original(path, '169c4cb405c528df0d719e36d0249ba193676bf9')
          marker = '    /// A CMG pair solver failed.\n'
          assert text.count(marker) == 1
          variants = '''    /// A caller-owned workspace size or byte count overflowed.
              #[error("workspace size overflow in {context}")]
              WorkspaceSizeOverflow {
                  /// Operation whose checked size calculation failed.
                  context: &'static str,
              },
              /// A caller-owned workspace could not reserve requested storage.
              #[error("workspace allocation failed in {context}: {source}")]
              WorkspaceAllocation {
                  /// Operation that attempted the reservation.
                  context: &'static str,
                  /// Allocation or capacity-overflow error from the standard library.
                  source: std::collections::TryReserveError,
              },
          '''
          Path(path).write_text(text.replace(marker, variants + marker, 1))

          path = 'CHANGELOG.md'
          text = original(path, 'b071e96d9c2732a019286778d045809156fb7cca')
          marker = '### Added\n\n'
          assert marker in text
          entry = ('- Caller-owned recursive MAP hierarchy traversal workspace with checked\n'
                   '  retained-heap accounting, transactional output, and cross-instance reuse.\n'
                   '  MAP/projection internals still allocate; see `docs/ISSUE5_WORKSPACES.md`.\n')
          Path(path).write_text(text.replace(marker, marker + entry, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit permanent source without assembly machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue5-clean-hierarchy-assembly.yml
          git add CHANGELOG.md crates/multiway-mg/src/cycle_hierarchy.rs \
            crates/multiway-mg/src/cycle_hierarchy/workspace.rs \
            crates/multiway-mg/src/lib.rs crates/multiway-mg/src/error.rs \
            crates/multiway-mg/tests/hierarchy_workspace.rs docs/ISSUE5_WORKSPACES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Assemble and format permanent hierarchy workspace source"
          git push origin HEAD:implementation/issue-5-hierarchy-assembly
          git log -1 --format='source_commit=%H%nsource_tree=%T'
          git diff --stat b4f41fd510cc5c23b34d3ff3c469f262c69556cc HEAD
