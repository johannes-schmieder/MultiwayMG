name: One-time compatible defect normalization

on:
  push:
    branches:
      - codex/issue-3-compatible-relaxation

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-compatible-relaxation
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Normalize defects and apply rustfmt
        run: |
          python3 scripts/normalize_compatible_defects.py
          cargo fmt --all
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Normalize compatible defects against the initial norm"
          git push origin HEAD:codex/issue-3-compatible-relaxation
