name: Issue 4 workspace export

on:
  push:
    branches:
      - codex/issue-4-pair-solver-economics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export tracked workspace and pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Record source revision
        run: git rev-parse HEAD > issue4-source-revision.txt
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=multiwaymg-source.tar.gz HEAD
      - name: Vendor locked dependency sources
        run: |
          cargo vendor --locked issue4-vendor >/tmp/issue4-vendor-config.toml
          tar -czf issue4-vendor.tar.gz issue4-vendor
      - name: Export full pinned comparator repositories
        run: |
          git clone --quiet https://github.com/py-econometrics/within.git issue4-within
          git -C issue4-within checkout --quiet b7779cbab7a3116be56aae4389fde1f6e6a99a9f
          rm -rf issue4-within/.git
          tar -czf issue4-within-source.tar.gz issue4-within
          git clone --quiet https://github.com/johannes-schmieder/CMG.git issue4-cmg
          git -C issue4-cmg checkout --quiet 90e1fe0b0c14065155532711246ede6678bb4935
          rm -rf issue4-cmg/.git
          tar -czf issue4-cmg-source.tar.gz issue4-cmg
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-workspace-source
          path: |
            multiwaymg-source.tar.gz
            issue4-source-revision.txt
            issue4-vendor.tar.gz
            issue4-within-source.tar.gz
            issue4-cmg-source.tar.gz
          if-no-files-found: error
          retention-days: 3
