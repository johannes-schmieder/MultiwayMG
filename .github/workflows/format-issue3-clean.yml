name: One-time issue 3 completion formatting

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-completion-clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply exact formatter output
        run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Apply Rust 1.85 formatting to issue 3 completion"
          git push origin HEAD:codex/issue-3-completion-clean
