name: Validate repaired issue 3 completion

on:
  push:
    branches:
      - codex/issue-3-completion-clean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  authoritative-holdouts:
    name: Frozen one-level and recursive automatic-coarsening gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Verify frozen policies
        run: |
          test -f benchmarks/policies/issue3-cycle-portfolio-v2.tsv
          test -f benchmarks/policies/issue3-recursive-cycle-v1.tsv
          grep -q $'fixture\tcover-latin-a\t700' benchmarks/policies/issue3-cycle-portfolio-v2.tsv
          grep -q $'fixture\tcover-communities-b\t709' benchmarks/policies/issue3-cycle-portfolio-v2.tsv
          grep -q $'fixture\trecursive-latin-depth-2\t800' benchmarks/policies/issue3-recursive-cycle-v1.tsv
          grep -q $'fixture\trecursive-communities-depth-3\t807' benchmarks/policies/issue3-recursive-cycle-v1.tsv
      - name: Run one-level frozen holdout twice
        run: |
          rm -rf out
          mkdir -p out/cycle-a out/cycle-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_cycle_holdout --all-features -- out/cycle-a
          cargo run --locked --release -p multiway-mg \
            --example issue3_cycle_holdout --all-features -- out/cycle-b
          cmp out/cycle-a/issue3-cycle-holdout.tsv \
              out/cycle-b/issue3-cycle-holdout.tsv
          cmp out/cycle-a/issue3-cycle-traces.tsv \
              out/cycle-b/issue3-cycle-traces.tsv
          python3 scripts/summarize_issue3_cycle_holdout.py \
            out/cycle-a out/cycle-a/ISSUE3_CYCLE_HOLDOUT_RESULTS.md
      - name: Run recursive frozen holdout twice
        run: |
          mkdir -p out/recursive-a out/recursive-b
          cargo run --locked --release -p multiway-mg \
            --example issue3_recursive_holdout --all-features -- out/recursive-a
          cargo run --locked --release -p multiway-mg \
            --example issue3_recursive_holdout --all-features -- out/recursive-b
          cmp out/recursive-a/issue3-recursive-holdout.tsv \
              out/recursive-b/issue3-recursive-holdout.tsv
          cmp out/recursive-a/issue3-recursive-traces.tsv \
              out/recursive-b/issue3-recursive-traces.tsv
          python3 scripts/summarize_issue3_recursive_holdout.py \
            out/recursive-a out/recursive-a/ISSUE3_RECURSIVE_HOLDOUT_RESULTS.md
      - name: Record deterministic checksums
        run: |
          sha256sum \
            out/cycle-a/issue3-cycle-holdout.tsv \
            out/cycle-a/issue3-cycle-traces.tsv \
            out/recursive-a/issue3-recursive-holdout.tsv \
            out/recursive-a/issue3-recursive-traces.tsv \
            > out/issue3-final-holdouts.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-issue3-authoritative-holdouts
          path: out
          if-no-files-found: error
