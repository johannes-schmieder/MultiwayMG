name: Assemble reviewed MAP cycle refinements
on:
  push:
    branches: [implementation/issue-5-cycle-review]
    paths: [.github/workflows/issue5-cycle-review-assembly.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply bounded review refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p=Path(path); text=p.read_text(); assert text.count(old)==1,(path,old)
              p.write_text(text.replace(old,new,1))
          edit('crates/multiway-mg/src/cycle_hierarchy/workspace.rs',
               '        descriptors\n            .checked_add(vectors)\n            .and_then(|n| n.checked_add(operators::required_bytes(self).ok()?))',
               '        let operator_bytes = operators::required_bytes(self)?;\n        descriptors\n            .checked_add(vectors)\n            .and_then(|n| n.checked_add(operator_bytes))')
          edit('CHANGELOG.md', '  MAP/projection internals still allocate; see `docs/ISSUE5_WORKSPACES.md`.',
               '  Extended to nested operator scratch below; see `docs/ISSUE5_WORKSPACES.md`.')
          edit('docs/ISSUE5_OPERATOR_WORKSPACES.md',
               'and dense-terminal **application** APIs. Hierarchy integration and the measured complete-cycle allocation contract are\nnow documented in `ISSUE5_WORKSPACES.md`. No timing improvement,',
               'and dense-terminal **application** APIs. Hierarchy integration and the measured\ncomplete-cycle allocation contract are now documented in `ISSUE5_WORKSPACES.md`.\nNo timing improvement,')
          edit('docs/ISSUE5_PCG_WORKSPACE.md',
               'trace storage. The complete prepared MAP hierarchy now retains its nested operator scratch;\nsee `ISSUE5_WORKSPACES.md` for the allocation gate. Outer PCG vectors,\nprojection calls and trace storage still allocate. It is not a claim of allocation-free complete solves, full peak-memory',
               'trace storage. The complete prepared MAP hierarchy now retains its nested\noperator scratch; see `ISSUE5_WORKSPACES.md` for the allocation gate. Outer PCG\nvectors, projection calls and trace storage still allocate. This is not a claim\nof allocation-free complete solves, full peak-memory')
          edit('crates/multiway-mg/tests/workspace_allocations.rs',
               '    reuse.try_prepare_for(hierarchy)?;',
               '    let reprepare = measure(|| reuse.try_prepare_for(hierarchy))?;')
          edit('crates/multiway-mg/tests/workspace_allocations.rs',
               '    equal_bits(&out, &reference);\n    assert_eq!(workspace.retained_bytes()?, retained);',
               '''    equal_bits(&out, &reference);
              assert_eq!(workspace.retained_bytes()?, retained);
              let mut varied_rhs = rhs.clone();
              for scale in [0.0, -2.0, 0.5] {
                  for (value, original) in varied_rhs.iter_mut().zip(&rhs) { *value = scale * original; }
                  hierarchy.apply(&varied_rhs, &mut reference)?;
                  no_events(measure(|| hierarchy.apply_with_workspace(black_box(&varied_rhs), black_box(&mut out), &mut workspace))?);
                  equal_bits(&out, &reference);
              }
              hierarchy.apply(&rhs, &mut reference)?;''')
          edit('crates/multiway-mg/tests/workspace_allocations.rs',
               '    assert_eq!(reuse.retained_bytes()?, bytes);\n    println!(',
               '''    assert_eq!(reuse.retained_bytes()?, bytes);
              // Fresh workspace owns no unique identity token; dropping it must release
              // precisely its exclusive payload while the immutable hierarchy lives.
              let before = GLOBAL.stats();
              drop(workspace);
              let released = GLOBAL.stats() - before;
              assert_eq!(released.allocations, 0);
              assert_eq!(released.reallocations, 0);
              assert_eq!(released.bytes_deallocated, retained);
              println!("reprepare {name} allocations={} reallocations={} bytes_allocated={} bytes_deallocated={}", reprepare.allocations, reprepare.reallocations, reprepare.bytes_allocated, reprepare.bytes_deallocated);
              println!(''')
          edit('docs/ISSUE5_WORKSPACES.md',
               'workspace setup bytes must match the reported exclusive retained payload.',
               'workspace setup bytes must match the reported exclusive retained payload;\ndropping that workspace while its hierarchy lives must release exactly that\npayload. Reprepare allocator traffic is reported separately, and signed/scaled\nand zero RHS checks run outside the fixture-construction boundary.')
          PY
          cargo fmt --all
          git diff --check
      - name: Commit permanent tree only
        run: |
          set -euo pipefail
          git rm .github/workflows/issue5-cycle-review-assembly.yml
          git add crates docs CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Strengthen allocation lifetime proof and clarify memory diagnostics'
          git push origin HEAD:implementation/issue-5-cycle-review
          git log -1 --format='source_commit=%H%nsource_tree=%T'
