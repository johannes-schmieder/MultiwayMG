[workspace]
members = [
    "crates/multiway-incidence",
    "crates/multiway-mg",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Johannes Schmieder"]
license = "GPL-3.0-only"
repository = "https://github.com/johannes-schmieder/MultiwayMG"

[workspace.dependencies]
thiserror = "2.0.16"
nalgebra = { version = "0.33.2", default-features = false, features = ["std"] }
cmg = { git = "https://github.com/johannes-schmieder/CMG", rev = "a4c927f49eb7a5391a63963d2c4c651a51cf1af5" }
schwarz-precond = { git = "https://github.com/johannes-schmieder/within", rev = "ffc1a5685ef9a049ac802687f2950319d7892bad", package = "schwarz-precond" }
within = { git = "https://github.com/johannes-schmieder/within", rev = "ffc1a5685ef9a049ac802687f2950319d7892bad", package = "within" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_range_loop = "allow"
