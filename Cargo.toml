[workspace]
members = [
    "crates/multiway-incidence",
    "crates/multiway-mg",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Johannes Schmieder"]
license = "GPL-3.0-only"
repository = "https://github.com/johannes-schmieder/MultiwayMG"

[workspace.dependencies]
thiserror = "2.0.16"
nalgebra = { version = "0.33.2", default-features = false, features = ["std"] }
cmg = { git = "https://github.com/johannes-schmieder/CMG", rev = "90e1fe0b0c14065155532711246ede6678bb4935" }
schwarz-precond = { git = "https://github.com/johannes-schmieder/within", rev = "504fbb7dee84e2d902190c6485cdfef0c83f7ce0", package = "schwarz-precond" }
within = { git = "https://github.com/johannes-schmieder/within", rev = "504fbb7dee84e2d902190c6485cdfef0c83f7ce0", package = "within" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_range_loop = "allow"
