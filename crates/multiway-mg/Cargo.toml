[package]
name = "multiway-mg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental multilevel solvers for weighted three-way incidence Gramians"

[features]
default = ["cmg", "lsmr"]
cmg = ["dep:cmg"]
lsmr = ["dep:schwarz-precond"]

[dependencies]
multiway-incidence = { path = "../multiway-incidence" }
thiserror.workspace = true
nalgebra.workspace = true
cmg = { workspace = true, optional = true }
schwarz-precond = { workspace = true, optional = true }

[[example]]
name = "feasibility_matrix"
required-features = ["cmg", "lsmr"]

[[example]]
name = "scaling_probe"
required-features = ["cmg", "lsmr"]

[[example]]
name = "difficult_scaling_probe"
required-features = ["cmg", "lsmr"]

[[example]]
name = "oracle_spectral_matrix"
required-features = ["cmg"]

[[example]]
name = "compatible_relaxation_matrix"
required-features = ["cmg"]

[[example]]
name = "issue2_two_grid_matrix"
required-features = ["cmg"]

[[example]]
name = "issue2_resolution_matrix"
required-features = ["cmg"]

[[example]]
name = "issue2_setup_cost_matrix"
required-features = ["cmg"]

[[example]]
name = "issue3_automatic_gap_matrix"
required-features = ["cmg"]

[lints]
workspace = true
