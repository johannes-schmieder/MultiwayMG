[package]
name = "multiway-mg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["cmg", "lsmr", "within-comparator"]
cmg = ["dep:cmg"]
lsmr = ["dep:lsmr"]
within-comparator = ["dep:within", "dep:schwarz-precond"]

[dependencies]
multiway-incidence = { path = "../multiway-incidence" }
nalgebra.workspace = true
thiserror.workspace = true
cmg = { workspace = true, optional = true }
lsmr = { workspace = true, optional = true }
within = { workspace = true, optional = true }
schwarz-precond = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true

